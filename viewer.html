<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVA response</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="header" hidden>
      <div class="title-row">
        <h1 id="endpoint"></h1>
        <span id="env-pill"></span>
      </div>
      <div class="meta">
        <span id="url"></span>
        <span class="dot">·</span>
        <span id="when"></span>
        <span class="dot">·</span>
        <span id="row-count"></span>
      </div>
      <div class="controls">
        <input type="search" id="filter" placeholder="Filter by path or value…" autocomplete="off" />
        <button type="button" id="toggle-request" hidden title="Show request alongside response">Show request</button>
        <button type="button" id="copy-all" title="Copy all visible response rows as TSV">Copy response</button>
      </div>
    </header>
    <main id="content">
      <section id="request-panel" hidden>
        <h2 class="panel-title">Request</h2>
        <h3 class="subhead">Headers</h3>
        <div id="request-headers" class="panel-body">Loading…</div>
        <h3 class="subhead">Payload</h3>
        <div id="request-payload" class="panel-body">Loading…</div>
      </section>
      <section id="response-panel">
        <h2 class="panel-title">Response</h2>
        <div id="response-body" class="panel-body">Loading…</div>
      </section>
    </main>
    <script src="viewer.js"></script>
  </body>
</html>
